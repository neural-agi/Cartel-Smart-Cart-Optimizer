name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  verify:
    name: Compile and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r backend/requirements/dev.txt

      - name: Compile application and tests
        run: python -m compileall backend/app backend/tests scripts

      - name: Run complete test suite
        env:
          PYTHONPATH: backend
        run: python -m pytest backend/tests -q
