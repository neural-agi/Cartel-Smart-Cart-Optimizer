services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cartel
      POSTGRES_USER: cartel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD from the deployment secret manager}
    volumes:
      - cartel-postgres:/var/lib/postgresql/data
    networks:
      - cartel
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cartel -d cartel"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_NAME: Cartel
      APP_ENV: production
      APP_DEBUG: "false"
      APP_VERSION: 0.1.0
      API_V1_PREFIX: /api/v1
      LOG_LEVEL: INFO
      LOG_JSON: "true"
      DOCS_ENABLED: "false"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      AUTH_REQUIRED: "true"
      AUTH_TOKENS: ${AUTH_TOKENS:?set AUTH_TOKENS as user_id=token pairs for the deployment environment}
      DATABASE_REQUIRED: "true"
      POSTGRES_HOST: postgres
      POSTGRES_DB: cartel
      POSTGRES_USER: cartel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD from the deployment secret manager}
      AUTH_COOKIE_SECURE: "true"
      AUTH_SESSION_DAYS: ${AUTH_SESSION_DAYS:-14}
      AUTH_IDLE_DAYS: ${AUTH_IDLE_DAYS:-7}
      AUTH_CHALLENGE_MINUTES: ${AUTH_CHALLENGE_MINUTES:-30}
      AUTH_RATE_LIMIT_REQUESTS: ${AUTH_RATE_LIMIT_REQUESTS:-8}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN to the browser-visible application origin}
      SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST to a configured mail relay}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:?set SMTP_FROM to the verified sender address}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-120}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      CHECKOUT_OBSERVATION_PROVIDER_MODE: unavailable
      CHECKOUT_CAPTURE_ADAPTER_MODE: unavailable
      BLINKIT_DELIVERY_LOCATION_NAME: Gurugram
      BLINKIT_DELIVERY_LATITUDE: "28.413333"
      BLINKIT_DELIVERY_LONGITUDE: "77.072833"
      DATA_DIR: /app/data
    expose:
      - "8000"
    volumes:
      - cartel-data:/app/data
    networks:
      - cartel
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; response=urllib.request.urlopen('http://localhost:8000/ready'); raise SystemExit(0 if response.status == 200 else 1)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://api:8000}
    environment:
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://api:8000}
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - cartel
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:3000/home"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  cartel:
    driver: bridge

volumes:
  cartel-data:
  cartel-postgres:
