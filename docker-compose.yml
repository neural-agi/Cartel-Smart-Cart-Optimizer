services:
  api:
    working_dir: /app/backend
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_NAME: Cartel
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_VERSION: 0.1.0
      API_V1_PREFIX: /api/v1
      LOG_LEVEL: INFO
      LOG_JSON: "true"
      DOCS_ENABLED: "false"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      AUTH_REQUIRED: ${AUTH_REQUIRED:-true}
      AUTH_TOKENS: ${AUTH_TOKENS:?set AUTH_TOKENS as user_id=token pairs for the deployment environment}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-120}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      CHECKOUT_OBSERVATION_PROVIDER_MODE: unavailable
      CHECKOUT_CAPTURE_ADAPTER_MODE: unavailable
      BLINKIT_DELIVERY_LOCATION_NAME: Gurugram
      BLINKIT_DELIVERY_LATITUDE: "28.413333"
      BLINKIT_DELIVERY_LONGITUDE: "77.072833"
      DATA_DIR: /app/data
      DATABASE_REQUIRED: "true"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-cartel}
      POSTGRES_USER: ${POSTGRES_USER:-cartel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD for the deployment environment}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cartel}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD for the deployment environment}@postgres:5432/${POSTGRES_DB:-cartel}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    networks:
      - cartel
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; response=urllib.request.urlopen('http://localhost:8000/ready'); raise SystemExit(0 if response.status == 200 else 1)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cartel}
      POSTGRES_USER: ${POSTGRES_USER:-cartel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD for the deployment environment}
    ports:
      - "${POSTGRES_PUBLISH_PORT:-5432}:5432"
    volumes:
      - cartel-postgres-data:/var/lib/postgresql/data
    networks:
      - cartel
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    networks:
      - cartel
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  worker:
    working_dir: /app/backend
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.worker_entrypoint"]
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      AUTH_TOKENS: ${AUTH_TOKENS:?set AUTH_TOKENS as user_id=token pairs for the deployment environment}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-cartel}
      POSTGRES_USER: ${POSTGRES_USER:-cartel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD for the deployment environment}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cartel}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD for the deployment environment}@postgres:5432/${POSTGRES_DB:-cartel}
      REDIS_URL: redis://redis:6379/0
      DATA_DIR: /app/data
      EMAIL_DELIVERY_MODE: ${EMAIL_DELIVERY_MODE:-file}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    networks:
      - cartel

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://api:8000}
    environment:
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://api:8000}
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - cartel
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:3000/home"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  cartel-postgres-data:

networks:
  cartel:
    driver: bridge
