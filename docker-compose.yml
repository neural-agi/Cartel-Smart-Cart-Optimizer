services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_NAME: Cartel
      APP_ENV: production
      APP_DEBUG: "false"
      APP_VERSION: 0.1.0
      API_V1_PREFIX: /api/v1
      LOG_LEVEL: INFO
      LOG_JSON: "true"
      DOCS_ENABLED: "false"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      AUTH_REQUIRED: "true"
      AUTH_TOKENS: ${AUTH_TOKENS:?set AUTH_TOKENS as user_id=token pairs for the deployment environment}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-120}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      CHECKOUT_OBSERVATION_PROVIDER_MODE: unavailable
      CHECKOUT_CAPTURE_ADAPTER_MODE: unavailable
      BLINKIT_DELIVERY_LOCATION_NAME: Gurugram
      BLINKIT_DELIVERY_LATITUDE: "28.413333"
      BLINKIT_DELIVERY_LONGITUDE: "77.072833"
      DATA_DIR: /app/data
    expose:
      - "8000"
    volumes:
      - cartel-data:/app/data
    networks:
      - cartel
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; response=urllib.request.urlopen('http://localhost:8000/ready'); raise SystemExit(0 if response.status == 200 else 1)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://api:8000}
    environment:
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://api:8000}
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - cartel
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:3000/home"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  cartel:
    driver: bridge

volumes:
  cartel-data:
